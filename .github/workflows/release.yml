name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        id: release
        # No release-type here — the action reads release-please-config.json,
        # which sets release-type: node + bump-minor-pre-major: true so breaking
        # changes only bump the minor version while the package is pre-1.0.0.

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      # OIDC trusted publishing: id-token: write mints the short-lived token npm
      # exchanges for publish + provenance. No NPM_TOKEN secret is used.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install integrity-pinned npm (required for OIDC trusted publishing)
        working-directory: ${{ runner.temp }}
        run: |
          # Verify the registry tarball before extracting or running the publishing tool.
          # npm 11 retains Node 22 support and OIDC trusted publishing.
          curl --fail --silent --show-error --location --output npm.tgz https://registry.npmjs.org/npm/-/npm-11.21.1.tgz
          echo "613ccbe90044257c87713bb426251ced128ca7e9b3949b65eeb18b98445a5d441e14720c73d6ad76be86f4cf42f2f0d66efe347a9a13400ccd2f6fcfb5954385  npm.tgz" | shasum -a 512 --check --strict
          mkdir -p npm-toolchain/bin
          tar -xzf npm.tgz -C npm-toolchain
          ln -s ../package/bin/npm-cli.js npm-toolchain/bin/npm
          ln -s ../package/bin/npx-cli.js npm-toolchain/bin/npx
          echo "$RUNNER_TEMP/npm-toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify npm version
        run: test "$(npm --version)" = "11.21.1"

      - name: Install dependencies
        run: npm ci

      # Recheck at publish time: new advisories may postdate the last green CI run.
      - name: Security audit (npm audit)
        run: npm run audit:ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package exports (publint + attw)
        run: npm run check:exports

      # `publishConfig.provenance: true` in package.json makes `npm publish`
      # attach a provenance attestation automatically under OIDC; the explicit
      # flags below are belt-and-suspenders. `--access public` is required for a
      # scoped package on first publish.
      - name: Publish to npm
        run: npm publish --provenance --access public
