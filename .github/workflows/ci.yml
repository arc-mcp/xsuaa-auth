name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# Minimum required GITHUB_TOKEN permissions. All jobs only read the repo.
permissions:
  contents: read

jobs:
  # Primary gate: lint, typecheck, test, build, and the publint/attw export
  # check, on every supported Node line. This is what a PR must pass.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Audit all prod/dev dependencies; HIGH/CRITICAL findings and audit errors block.
      - name: Security audit (npm audit)
        run: npm run audit:ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # publint + are-the-types-wrong (ESM-only profile): catches a broken
      # exports map, missing/mis-shaped .d.ts, or a CJS/ESM resolution gap
      # before publish.
      - name: Check package exports (publint + attw)
        run: npm run check:exports

  # Peer compatibility matrix (SPEC §4): run the full test suite against the
  # Express floor and the current line so a peer bump in a consumer can't
  # silently break us. The MCP SDK is no longer a peer; tests/sdk-consumers.test.ts
  # covers an SDK v1 and an SDK v2 server at the dev versions.
  peer-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        express: ['5.0.1', '5.2.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pin peer (express@${{ matrix.express }})
        run: npm install --no-save --no-audit --no-fund "express@${{ matrix.express }}"

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
