name: Dependency audit

on:
  schedule:
    # New advisories can affect an unchanged lockfile. Avoid the top of the hour.
    - cron: '23 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # No npm install: audit both production and development dependencies
      # directly from the committed lockfile, without running package code.
      - name: Audit locked dependencies
        run: npm audit --package-lock-only --audit-level=high
